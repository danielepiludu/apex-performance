<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apex Performance</title>
<meta name="theme-color" content="#09090A">
<meta name="description" content="Programmi di allenamento per preparatori atletici">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Apex Performance">
<style>
:root{--bg:#09090A;--panel:#111113;--panel2:#18181B;--line:#26262B;--ink:#EDEDEF;--muted:#8A8A93;--accent:#E5262D;--accent-soft:rgba(229,38,45,.14);--good:#3DC57C;
--font:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Arial,sans-serif;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:400 14px/1.45 var(--font);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{display:flex;height:100vh;height:100dvh}
/* sidebar */
.side{width:232px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px;transition:width .15s}
.side.min{width:60px}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;font-weight:700;font-size:17px;letter-spacing:.01em}
.logo i{width:26px;height:26px;border-radius:7px;background:var(--accent);display:grid;place-items:center;flex:none}
.logo i svg{width:15px;height:15px;stroke:#fff}
.logo span{white-space:nowrap;overflow:hidden}
.side.min .logo span,.side.min .nv span,.side.min .sfoot span{display:none}
.nv{display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;border:0;background:none;border-radius:8px;color:#C9C9CF;text-align:left;font-size:14px}
.nv svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nv:hover{background:var(--panel2)}
.nv[aria-current=page]{background:var(--panel2);color:#fff;box-shadow:inset 2px 0 0 var(--accent)}
.nv .soon{margin-left:auto;font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:1px 6px}
.spacer{flex:1}
.sfoot{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.bar{height:56px;flex:none;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 18px}
.ibtn{width:34px;height:34px;border:0;background:none;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.ibtn:hover{background:var(--panel2);color:var(--ink)}
.ibtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round}
.teamsel{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:0 10px;height:36px}
.teamsel i{width:9px;height:9px;border-radius:50%;background:var(--tc,var(--muted));flex:none}
.teamsel select{background:transparent;border:0;height:34px;padding-right:4px;max-width:46vw;font-weight:600}
.teamsel select option{background:#18181B}
.content{flex:1;overflow:auto;padding:28px 28px 90px}
.page{max-width:1000px;margin:0 auto}
.ph{display:flex;align-items:flex-end;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.ph h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.01em}
.ph .sub{color:var(--muted);margin-top:2px}
.grow{flex:1}
/* controls */
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:0 14px;height:38px;font-weight:600;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{border-color:#3a3a42}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}.btn.pri:hover{filter:brightness(1.1)}
.btn.danger{color:#ff6b72}.btn.sm{height:30px;padding:0 10px;font-size:13px}
.inp{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:9px;height:40px;padding:0 12px}
textarea.inp{height:auto;padding:10px 12px;resize:vertical}
.inp:focus{border-color:var(--accent);outline:none}
.search{max-width:260px}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.fld>label,.lab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* lists */
.list{border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;min-height:60px}
.row:last-child{border:0}.row:hover{background:var(--panel2)}
.av{width:38px;height:38px;border-radius:50%;background:var(--ac,#333);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.rn{font-weight:600}.rs{color:var(--muted);font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;justify-content:flex-end}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;border:1px solid var(--line);border-radius:99px;padding:2px 9px;color:#cfcfd5;background:var(--panel2);white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--tc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;border-top:3px solid var(--tc)}
.card:hover{background:var(--panel2)}
.card h3{margin:0 0 4px;font-size:16px}.card .big{font-size:28px;font-weight:700;margin-top:10px}
.empty{border:1px dashed var(--line);border-radius:12px;padding:48px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
.soonp{text-align:center;padding:90px 20px;color:var(--muted)}.soonp h2{color:var(--ink);margin:0 0 8px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal{background:var(--panel);border:1px solid var(--line);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:20px}
.modal h3{margin:0 0 16px;font-size:18px}
.mf{display:flex;gap:10px;margin-top:18px}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:30px;height:30px;border-radius:50%;border:2px solid transparent;background:var(--c)}
.sw button[aria-pressed=true]{border-color:#fff;box-shadow:0 0 0 2px var(--c)}
.chk{display:flex;gap:8px;flex-wrap:wrap}
.chk button{border:1px solid var(--line);background:var(--panel2);border-radius:99px;padding:6px 12px;display:inline-flex;align-items:center;gap:7px}
.chk button i{width:8px;height:8px;border-radius:50%;background:var(--tc)}
.chk button[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#fff;color:#000;padding:10px 16px;border-radius:9px;font-weight:600;z-index:90}
.banner{background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px;padding:9px 13px;margin-bottom:16px;font-size:13px}
@media (min-width:760px){.ov{align-items:center}.modal{border-radius:16px}}
@media (max-width:759px){
  .side{position:fixed;left:0;top:0;bottom:0;z-index:40;width:250px;transform:translateX(-100%);transition:transform .18s}
  .side.open{transform:none}.side.min{width:250px}
  .side.min .logo span,.side.min .nv span,.side.min .sfoot span{display:inline}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:35}
  .content{padding:18px 14px 90px}.bar{padding:0 10px}
  .chips{display:none}.ph h1{font-size:21px}.search{max-width:none;flex:1}
  .two{grid-template-columns:1fr}
}

.stat{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted)}
.sd{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}.sd.ok{background:var(--good)}.sd.pend,.sd.off{background:#F5B02A}.sd.local{background:var(--muted)}
.gdot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:10px;vertical-align:middle}
.addg{display:flex;gap:8px;margin-top:8px}
@media (max-width:759px){.stat span{display:none}}

/* ================= Fase 2: programmi ================= */
.content.wide .page{max-width:none}
.btn.ghost{background:none;border-color:transparent}.btn.ghost:hover{background:var(--panel2)}
.btn.ico{width:34px;padding:0;justify-content:center}.btn.ico svg,.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn.wide{width:100%;justify-content:center;margin-top:12px;height:46px}
.btn[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.ibtn.sm{width:26px;height:26px;font-size:13px}.ibtn.sm svg{width:15px;height:15px}.ibtn:disabled{opacity:.3;cursor:default}
.lnk{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:12.5px;padding:0}.lnk:hover{color:var(--ink)}
.muted{color:var(--muted)}.small{font-size:12.5px}
.hint{color:var(--muted);font-size:13px;margin:4px 0 12px}
.inp.sel{height:34px;padding:0 8px;width:auto}
select.inp option{background:#18181B}
.danger{color:#ff6b72}
/* card programmi */
.pcard{text-align:left;display:flex;flex-direction:column;gap:4px;font:inherit;color:inherit}
.pstats{display:flex;gap:14px;margin:12px 0 6px;color:var(--muted);font-size:13px}.pstats b{color:var(--ink);font-size:18px;margin-right:3px}
/* barra editor */
.edbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:-8px 0 4px}
.pname{background:none;border:1px solid transparent;border-radius:8px;font-size:20px;font-weight:700;padding:4px 8px;min-width:120px;flex:0 1 420px}
.pname:hover{border-color:var(--line)}.pname:focus{border-color:var(--accent);outline:none;background:var(--panel2)}
.tsel{border-left:3px solid var(--tc)}
.edsub{color:var(--muted);font-size:12.5px;margin:0 0 14px 8px}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel2)}
.seg button{border:0;background:none;padding:0 11px;height:30px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed=true]{background:#2a2a30;color:#fff}
/* calendario */
.cal{border:1px solid var(--line);border-radius:12px;overflow:auto;background:var(--panel)}
.phh{display:flex;align-items:baseline;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:#0d0d0f;position:sticky;left:0;min-width:1000px;font-size:13px}
.phh b{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:#fff;border-left:3px solid var(--accent);padding-left:8px}
.phh .lnk{margin-left:auto}
.wk{display:grid;grid-template-columns:46px repeat(7,minmax(140px,1fr));min-width:1000px;border-bottom:1px solid var(--line)}
.wk:last-child{border-bottom:0}
.wl{border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:10px 0;color:var(--muted);font-size:12px}
.wl span{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap}
.dc{border-right:1px solid var(--line);padding:6px;min-height:120px;display:flex;flex-direction:column;gap:6px;position:relative}
.dc:last-child{border-right:0}
.dc.over{background:var(--accent-soft);outline:1px dashed var(--accent);outline-offset:-3px}
.dn{font-size:11.5px;color:var(--muted);text-align:right;padding:0 2px}
.addwo{flex:1;border:1px dashed transparent;background:none;border-radius:9px;color:transparent;font-size:22px;min-height:60px}
.dc:hover .addwo,.addwo:focus-visible{border-color:var(--line);color:var(--muted)}
.wcard{background:#141417;border:1px solid var(--line);border-radius:10px;padding:9px 9px 6px;cursor:pointer;font-size:12.5px;user-select:none}
.wcard:hover{border-color:#3a3a42;background:#17171b}
.wcard.dragging{opacity:.4}
.wt{font-weight:650;font-size:13px;line-height:1.3;margin-bottom:7px;display:flex;gap:6px;align-items:flex-start;justify-content:space-between}
.mdot{width:7px;height:7px;border-radius:50%;background:#fff;flex:none;margin-top:5px}
.cb{border-left:3px solid var(--bc);padding:1px 0 1px 7px;margin:0 0 7px}
.cbh{color:var(--muted);font-size:11px;margin-bottom:2px}
.cr{display:flex;gap:5px;line-height:1.35;padding:1px 0}.cr b{color:var(--bc);font-weight:600;min-width:15px;font-size:11.5px}
.cr span{color:#d6d6db}.cr em{display:block;font-style:normal;color:var(--muted);font-size:11.5px}
.cbars{display:flex;gap:4px;flex-wrap:wrap}.cbars i{font-style:normal;font-size:11px;border-left:3px solid var(--bc);background:var(--panel2);padding:1px 6px;border-radius:3px;color:#cfcfd5}
.cempty{color:var(--muted);font-size:12px;padding:6px 0}
/* telefono: lista per giorno */
.wkc{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.fc{flex:none;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:6px 12px;display:flex;flex-direction:column;align-items:flex-start;min-width:74px}
.fc b{font-size:13px}.fc small{color:var(--muted);font-size:11px}
.fc[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.fc.ps{margin-left:8px}
.mwh{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px}
.mday{margin-bottom:12px}.mday .dn{text-align:left;margin-bottom:4px}
.mday .wcard{font-size:14px;padding:12px}.mday .wt{font-size:15px}.mday .cr b{font-size:13px}
/* menu a comparsa */
.pop{position:fixed;z-index:80;background:#1b1b1f;border:1px solid #33333a;border-radius:10px;padding:5px;min-width:210px;box-shadow:0 12px 32px rgba(0,0,0,.5)}
.pop button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:7px;font-size:13.5px}
.pop button:hover:not(:disabled){background:#26262c}.pop button:disabled{opacity:.4;cursor:default}
.pop .ck{width:14px;color:var(--accent);font-weight:700}
.pop hr{border:0;border-top:1px solid var(--line);margin:4px 0}
/* fasi */
.phr{display:grid;grid-template-columns:1fr 110px 90px auto auto;gap:8px;align-items:center;margin-bottom:8px}
.wkn{display:flex;align-items:center;gap:6px}.wkn span{color:var(--muted);font-size:12px}.rng{font-size:12px}
/* editor allenamento */
.modal.wide{max-width:min(1280px,96vw);padding:18px 20px}
.weh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.wtitle{background:none;border:1px solid transparent;border-radius:8px;font-size:19px;font-weight:700;padding:4px 8px;flex:1 1 300px;min-width:0}
.wtitle:hover{border-color:var(--line)}.wtitle:focus{border-color:var(--accent);outline:none;background:var(--panel2)}
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table.wtab{border-collapse:collapse;width:100%;font-size:13px}
.wtab th{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:7px 4px;border-bottom:1px solid var(--line);background:#0f0f11;white-space:nowrap}
.wtab th.wkh{border-left:1px solid var(--line);color:#cfcfd5}.wtab th.cur,.wtab td.cur{background:rgba(255,255,255,.025)}
.wtab th.wsep,.wtab td.wsep{border-left:1px solid var(--line)}
.wtab td{padding:2px 3px;border-bottom:1px solid #1d1d21;vertical-align:middle}
.wtab .c0{width:38px;text-align:center}.wtab .c1{min-width:210px}
.wtab tr.er td.c0{border-left:3px solid var(--bc)}
.wtab tr.er.over td,.wtab tr.bh.over td,.wtab tr.gh.over td{box-shadow:inset 0 2px 0 var(--accent)}
.wtab tr.bh td{padding:10px 6px 4px;border-bottom:0}
.wtab tr.gh td{border-bottom:1px solid var(--line)}.wtab tr.gh td.c0{border-left:3px solid var(--bc)}
.bhin{display:flex;align-items:center;gap:10px;border-left:3px solid var(--bc);padding-left:8px}
.bhin b{font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.brest{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.brest input{width:60px;height:26px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:0 6px;text-align:center}
.code{font-weight:700;color:var(--bc);font-size:12.5px;cursor:grab}
.wtab input,.mrow input:not(.inp){width:100%;background:transparent;border:1px solid transparent;border-radius:6px;height:30px;padding:0 6px}
.wtab input:hover,.mrow input:not(.inp):hover{border-color:var(--line)}
.wtab input:focus,.mrow input:focus,.ghost input:focus{border-color:var(--accent);outline:none;background:var(--panel2)}
.wtab input.nm{font-weight:600}
.ce{text-align:center;min-width:44px}.ce.rest{min-width:52px}
.ce.base{color:#fff;font-weight:600}.ce.au{color:#8f8f98}.ce.man{color:#fff;font-weight:600;background:rgba(255,255,255,.06)!important}
.ce.ath{color:var(--muted);font-style:italic;cursor:not-allowed}.ce.ath::placeholder{color:#6a6a72}
.nt{min-width:120px;color:#cfcfd5}
.pgs{background:transparent;border:1px solid transparent;border-radius:6px;height:30px;max-width:150px;color:#cfcfd5;font-size:12.5px}
.pgs:hover{border-color:var(--line)}.pgs option{background:#18181B}
.ghost{display:flex;align-items:center;gap:8px}.ghost .code{min-width:24px;text-align:center;opacity:.6}
.ghost input{flex:1;background:transparent;border:1px dashed #2c2c33;border-radius:7px;height:32px;padding:0 10px}
.wefoot{display:flex;align-items:center;gap:14px;margin-top:12px;flex-wrap:wrap}
/* editor telefono */
.mrow{border:1px solid var(--line);border-left:3px solid var(--bc);border-radius:10px;padding:8px;margin:0 0 8px;background:#141417}
.mt{display:flex;align-items:center;gap:6px}.mt .code{min-width:24px}.mt input{font-weight:600;font-size:16px}
.mfl{display:grid;grid-template-columns:repeat(auto-fit,minmax(60px,1fr));gap:6px;margin-top:6px}
.mfl2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.mfl label,.mfl2 label{display:flex;flex-direction:column;gap:2px}.mfl label span,.mfl2 label span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.mfl input{height:42px!important;font-size:16px;background:var(--panel2)!important;border:1px solid var(--line)!important}
.mfl2 .inp{height:40px;font-size:15px;width:100%}
#wed>.bhin{margin:14px 0 8px}
.ghost.mg{margin:0 0 6px}.ghost.mg input{height:42px;font-size:16px}
@media (max-width:759px){
  .hm{display:none}.edbar{gap:6px}.pname{font-size:17px;flex:1 1 100%;order:-1}.edsub{margin-left:0}
  .modal.wide{max-width:100%;max-height:96vh;padding:14px 12px}
  .weh .wtitle{flex-basis:100%;font-size:17px}
  .phr{grid-template-columns:1fr 90px auto;}.phr .rng{display:none}
}
/* ritocchi */
.pname{flex:1 1 220px}
.brest{white-space:nowrap}
.ce.ath{font-size:11px;min-width:48px}
.pgs{max-width:175px}

/* ================= assegnazione + storico ================= */
.tag{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;border:1px solid var(--line);border-radius:5px;padding:0 5px;color:#cfcfd5}
.st{font-weight:600}.st-I{color:var(--good)}.st-D{color:#F5B02A}.st-C{color:var(--muted)}
.sdate{display:inline-flex;align-items:center;gap:6px}
.sdate input{background:var(--panel2);border:1px solid var(--line);border-radius:6px;height:26px;padding:0 6px;font-size:12.5px;color:var(--ink)}
.lrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.aplist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.apr{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--panel2);border:0;border-bottom:1px solid var(--line);padding:10px 12px}
.apr:last-child{border-bottom:0}.apr:hover{background:#202025}.apr span{color:var(--muted);font-size:12.5px}
.btn:disabled{opacity:.35;cursor:default}

/* ================= stampa per l'atleta ================= */
.prbar{display:flex;align-items:center;gap:12px;margin:-8px 0 14px;flex-wrap:wrap}
.prt{display:flex;flex-direction:column}.prt b{font-size:18px}
.prwrap{display:grid;grid-template-columns:290px minmax(0,1fr);gap:20px;align-items:start}
.propts{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;position:sticky;top:0}
.seg.full{display:flex}.seg.full button{flex:1;height:34px;padding:0 6px}
.cbx{display:flex;gap:8px;align-items:center;font-size:13.5px;margin:4px 0 8px}.cbx input{width:18px;height:18px;accent-color:var(--accent)}
.prprev{background:#26262b;border-radius:12px;padding:16px 4px;min-width:0;overflow:hidden}
.pages{transform-origin:top left}
/* il foglio: carta bianca, nero, niente fronzoli */
.sheet{background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif;font-size:11.5px;line-height:1.3;padding:9mm 10mm;margin:0 auto 18px;box-shadow:0 6px 24px rgba(0,0,0,.45);box-sizing:border-box}
.sheet.land{width:297mm;min-height:210mm}.sheet.port{width:210mm;min-height:297mm}
.sh-h{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;border-bottom:2.5px solid #111;padding-bottom:6px;margin-bottom:10px}
.sh-n{font-size:21px;font-weight:700;text-transform:uppercase;letter-spacing:.02em}
.nline{display:inline-block;width:75mm;border-bottom:1.2px solid #111;font-size:9px;font-weight:400;color:#888;text-transform:none;letter-spacing:0;height:22px;vertical-align:bottom}
.sh-p{font-size:11px;color:#555;margin-top:2px}
.sh-r{text-align:right}.sh-w{font-size:15px;font-weight:700}.sh-d{font-size:10.5px;color:#555;margin-top:2px}
table.sh{width:100%;border-collapse:collapse}
.sh th{font-size:8.5px;text-transform:uppercase;letter-spacing:.06em;color:#444;font-weight:700;padding:4px 3px;border-bottom:1.5px solid #111;text-align:center;white-space:nowrap}
.sh td{border-bottom:1px solid #c4c4c4;padding:6px 4px;text-align:center;font-size:12px;height:27px}
.sh .l{text-align:left}.sh td.ex{font-weight:700;min-width:45mm}
.sh .cod{width:9mm;font-weight:700;font-size:11px}
.sh th.wc,.sh td.wc{border-left:1.2px solid #888}
.sh td.bx{background:#fff;box-shadow:inset 0 0 0 1px #c4c4c4}
.sh td.off{background:#f2f2f2}
.sh td.nt{font-size:10px;color:#333;max-width:60mm}
.sh tr.bk td{background:#ececec;text-align:left;font-weight:700;font-size:9px;letter-spacing:.07em;text-transform:uppercase;padding:3px 6px;height:auto;border-bottom:1px solid #c4c4c4;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sh tr{break-inside:avoid}
.wo{break-inside:avoid;margin-bottom:14px}.wo-t{font-size:13.5px;font-weight:700;margin:2px 0 4px}
@media (max-width:759px){.prwrap{grid-template-columns:1fr}.propts{position:static}.prprev{padding:10px 2px}}
@media print{
  :root{color-scheme:light!important;background:#fff!important}
  html,body{background:#fff!important;height:auto!important}
  #app{display:block!important;height:auto!important}
  .side,.bar,.prbar,.propts,.scrim,.toast,.ov,.pop{display:none!important}
  .main,.content,.page,.prwrap,.prprev{display:block!important;overflow:visible!important;padding:0!important;margin:0!important;max-width:none!important;border:0!important;background:none!important;border-radius:0!important}
  .pages{zoom:1!important}
  .sheet{box-shadow:none;margin:0;width:auto;min-height:0;padding:0;break-after:page}
  .sheet:last-child{break-after:auto}
}

/* ================= logo e foto ================= */
[hidden]{display:none!important}
.imgf{display:flex;align-items:center;gap:14px}
.imgp{width:64px;height:64px;flex:none;background:var(--panel2);border:1px dashed #3a3a42;display:grid;place-items:center;overflow:hidden;color:var(--muted);font-size:11px}
.imgp.photo{border-radius:50%}.imgp.logo{border-radius:12px}
.imgp img{width:100%;height:100%;object-fit:cover}.imgp.logo img{object-fit:contain;padding:4px}
.imgb{display:flex;flex-direction:column;gap:6px}.imgbtn{display:flex;gap:6px}
.imgb label.btn{cursor:pointer}
.av{overflow:hidden}.av img{width:100%;height:100%;object-fit:cover}
.glogo{width:28px;height:28px;object-fit:contain;vertical-align:middle;margin-right:10px;border-radius:6px}

/* ================= foglio a colori ================= */
.sheet *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sh-h{align-items:center}
.sh-logo{flex:none;width:13mm;height:13mm;display:grid;place-items:center;margin-right:4mm}
.sh-logo img{max-width:100%;max-height:100%;object-fit:contain}
.sh-id{display:flex;align-items:center;gap:4mm;flex:1;min-width:0}
.sh-ph{width:12mm;height:12mm;border-radius:50%;object-fit:cover;flex:none;border:1.5px solid #ddd}
.sheet.color .sh-h{border-bottom:2px solid var(--ac);padding-bottom:3mm;margin-bottom:4mm}
.sheet.color .sh-n{color:#111}
.sheet.color .sh-w{color:var(--acd)}
.sheet.color .sh th{color:var(--acd);border-bottom:1.5px solid var(--ac)}
.sheet.color .sh th.wc,.sheet.color .sh td.wc{border-left:1px solid #b9bec7}
.sheet.color .sh tr.bk td{background:none;color:var(--bcd);box-shadow:inset 3px 0 0 var(--bc);padding:5px 6px 2px 9px;border-bottom:1px solid var(--bc)}
.sheet.color .sh td.cod{color:var(--bcd);box-shadow:inset 3px 0 0 var(--bc)}
.sheet.color .sh td{border-bottom-color:#dcdfe4}
.sheet.color .sh td.bx{box-shadow:inset 0 0 0 1px #c9ced6}
.sheet.color .wo-t{color:var(--acd);border-bottom:1px solid var(--ac);padding:0 0 2px}

/* ================= accesso e impostazioni ================= */
.login{min-height:100vh;min-height:100dvh;width:100%;display:grid;place-items:center;padding:24px}
.lcard{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:32px 26px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.logo.big{padding:0;font-size:26px;gap:12px}.logo.big i{width:44px;height:44px;border-radius:12px}.logo.big i svg{width:24px;height:24px;fill:#fff;stroke:#fff}
.lcard .muted{margin:0;font-size:14px}
.gbtn{background:#fff;color:#1f1f1f;border-color:#fff;height:46px;width:100%;justify-content:center;font-size:15px;gap:10px}.gbtn:hover{filter:brightness(.95)}
.lerr{color:#ff8a8f;font-size:13px;margin:0;min-height:1em}
.sets{display:flex;flex-direction:column;gap:14px;max-width:640px}
.sbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.sbox h3{margin:0 0 10px;font-size:15px}.sbox p{margin:6px 0}
.srow{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.av.sm{width:40px;height:40px;background:#333}
.sbox .sd{display:inline-block;margin-right:4px}
.sbox label.btn{cursor:pointer}

/* ================= storico ================= */
.hfil{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.hfil .inp.sel{height:36px}.hfil .hex{width:200px}
.hlist{display:flex;flex-direction:column;gap:8px}
.hm{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 0 2px}
.hcard{display:grid;grid-template-columns:110px 1fr;gap:14px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;color:inherit;width:100%}
.hcard:hover{background:var(--panel2)}
.hd{display:flex;flex-direction:column;gap:2px}.hd b{text-transform:capitalize}
.ht{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:2px}.ht b{font-size:15px}
ul.hex{list-style:none;margin:8px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:2px 18px}
ul.hex li{display:flex;gap:7px;font-size:13px;padding:2px 0}ul.hex li b{color:var(--muted);min-width:20px}
ul.hex li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}ul.hex li em{font-style:normal;color:#cfcfd5;font-variant-numeric:tabular-nums;white-space:nowrap}
ul.hex li.hl{background:var(--accent-soft);border-radius:5px;padding:2px 5px}
em.up,.kg.up span{color:var(--good)!important}em.dn,.kg.dn span{color:#F5B02A!important}
.hcal{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.hch{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:10px}.hch b{text-transform:capitalize;min-width:140px;text-align:center}
.hcg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.hdw{font-size:11px;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.06em;padding:2px 0}
.hcd{min-height:84px;border:1px solid var(--line);border-radius:8px;padding:4px;display:flex;flex-direction:column;gap:3px;min-width:0}
.hcd.out{border-color:transparent}.hcd.today{border-color:var(--accent)}
.hdn{align-self:flex-end;background:none;border:0;color:var(--muted);font-size:12px;padding:0 3px;border-radius:5px}.hdn:hover{background:var(--panel2);color:var(--ink)}
.hev{background:var(--accent-soft);border:0;border-left:3px solid var(--accent);border-radius:4px;color:var(--ink);font-size:11.5px;text-align:left;padding:2px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hev b{color:#fff}
.trend{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.trh{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.trw{position:relative}.tsvg{width:100%;height:auto;display:block;max-height:220px}
.tg{stroke:var(--line);stroke-width:1}.tl{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.tline{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.tdot{fill:var(--accent);stroke:var(--panel);stroke-width:2}.thit{fill:transparent;cursor:pointer}
.tv{fill:var(--ink);font-size:12px;font-weight:600}
.ttip{position:absolute;background:#1b1b1f;border:1px solid #33333a;border-radius:8px;padding:6px 9px;font-size:12px;pointer-events:none;width:150px;line-height:1.4}
/* card del calendario e dialogo di registrazione */
.done{font-size:11px;font-weight:700;color:var(--good);border:1px solid rgba(61,197,124,.4);border-radius:99px;padding:0 6px;white-space:nowrap;margin-left:auto}
.wt .done+.mdot{margin-left:4px}
.logb{width:100%;justify-content:center;margin-top:6px;height:38px}
.lgh{display:grid;grid-template-columns:1fr 170px 1.4fr;gap:10px}
.lgf{display:grid;grid-template-columns:170px 1fr;gap:10px;margin-top:12px}
.lgt{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:4px 0 8px}
.lgr{display:grid;grid-template-columns:54px minmax(170px,1.6fr) 62px 70px 110px minmax(110px,1fr) 28px;gap:8px;align-items:end;padding:8px 10px;border-bottom:1px solid var(--line)}
.lgr:last-child{border-bottom:0}.lgr.skip{opacity:.45}.lgr.skip .lgn input{text-decoration:line-through}
.lgr label{display:flex;flex-direction:column;gap:2px}.lgr label span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.lgr input:not([type=checkbox]){background:var(--panel2);border:1px solid var(--line);border-radius:7px;height:36px;padding:0 8px;width:100%}
.lgr input:focus{border-color:var(--accent);outline:none}
.lgc{flex-direction:row!important;align-items:center;gap:6px!important;height:36px}.lgc input{width:18px;height:18px;accent-color:var(--accent)}
.lgn{display:flex;flex-direction:column;gap:2px;min-width:0}.lgn input{font-weight:600}.lgn small{color:var(--muted);font-size:11.5px}
.lgr .kg input{font-weight:700;text-align:center}
.fld.wide{min-width:0}
@media (max-width:759px){
  .hcard{grid-template-columns:1fr;gap:4px}.hfil .hex{width:100%}
  .hcd{min-height:58px}.hev{font-size:10px;padding:1px 3px}
  .lgh{grid-template-columns:1fr 1fr}.lgh .wide{grid-column:1/-1}.lgf{grid-template-columns:1fr}
  .lgr{grid-template-columns:40px repeat(3,minmax(0,1fr)) 28px;grid-template-areas:"c n n n x" ". s r k k" ". t t t t"}
  .lgr .lgc{grid-area:c}.lgr .lgn{grid-area:n}.lgr [data-rm]{grid-area:x}
  .lgr label:nth-of-type(2){grid-area:s}.lgr label:nth-of-type(3){grid-area:r}.lgr .kg{grid-area:k}.lgr .nt{grid-area:t}
}
/* marchio Apex */
.lmark{height:26px;width:auto;flex:none;display:block}
.logo.big .lmark{height:52px}
.side.min .logo{padding-left:4px;padding-right:0}
/* firma */
.pwr{font-size:11.5px;color:var(--muted);padding:8px 10px 4px;letter-spacing:.02em}.pwr b{color:#cfcfd5;font-weight:600}
.side.min .pwr{display:none}
.login{grid-template-rows:1fr auto;gap:16px}.login>.lcard{align-self:end}.login>.pwr{align-self:start;text-align:center}
.sh-pw{margin-top:8px;text-align:right;font-size:8.5px;color:#999;letter-spacing:.04em}
.pw-print{display:none}
@media print{.sh-pw{display:none}.pw-print{display:block;position:fixed;bottom:0;right:0;font-size:8.5px;color:#999;letter-spacing:.04em;font-family:Arial,Helvetica,sans-serif}}
/* foglio "settimane affiancate": riempie la pagina */
.sh.fit td{height:var(--rh);font-size:var(--fsw);padding-top:0;padding-bottom:0}
.sh.fit td.ex{font-size:var(--fs);min-width:58mm}
.sh.fit td.cod{font-size:calc(var(--fs) * .95);width:11mm}
.sh.fit td.nt{font-size:calc(var(--fsw) * .8)}
.sh.fit th{font-size:calc(var(--fs) * .6);padding:1.4mm 1mm}
.sh.fit tr.bk td{height:auto;font-size:calc(var(--fs) * .66);padding:1.3mm 2mm 1mm 3mm}
.sheet.land .sh-n{font-size:26px}.sheet.land .sh-w{font-size:18px}.sheet.land .sh-p,.sheet.land .sh-d{font-size:12px}
@media print{.sheet.land,.sheet.port{min-height:0;width:auto}}
/* più spazio per scrivere i kg a mano */
.sh.fit{table-layout:fixed}
.sh.fit .kgc{width:var(--kgw);min-width:0}
.sh.fit .wc{width:var(--sxw)}
.sh.fit th.cod,.sh.fit td.cod{width:11mm}
.sh.fit td.ex{min-width:0;overflow:hidden;text-overflow:ellipsis}
.sh .kgc{min-width:17mm}
.sh td.kgu{min-width:15mm;height:10mm}

</style>

  if (p.prog) r.prog = typeof p.prog === 'string' ? clone(presetBy(p.prog).p) : clone(p.prog);

}

/* ============ modello del programma ============
   Program { name, teamId, loadMode: 'auto'|'ath', phases: [Phase], createdAt, updatedAt }
   Phase   { id, name, weeks, workouts: [Workout] }   le settimane di una fase hanno gli stessi esercizi
   Workout { id, day (1-7), title, blocks: [Block] }
   Block   { id, rest, rows: [Row] }                  1 esercizio = blocco singolo, 2 = superset, 3 = triset…
   Row     vedi progress.js (valori per ogni settimana della fase) */
const BLOCK_COLORS = ['#38BDF8', '#8B5CF6', '#FACC15', '#E879F9', '#22C55E', '#F97316', '#14B8A6', '#F43F5E'];
const bColor = bi => BLOCK_COLORS[bi % BLOCK_COLORS.length];
function blockKind(b) { const n = b.rows.length; return n === 2 ? 'Superset' : n === 3 ? 'Triset' : n >= 4 ? 'Circuito' : ''; }
function blockName(b, bi) { const k = blockKind(b); return `Blocco ${LETTERS[bi % 26]}${k ? ` (${k})` : ''}`; }
const rowCode = (b, bi, ri) => LETTERS[bi % 26] + (b.rows.length > 1 ? ri + 1 : '');

const totalWeeks = P => P.phases.reduce((a, p) => a + p.weeks, 0);
function phaseStart(P, pi) { let s = 0; for (let i = 0; i < pi; i++) s += P.phases[i].weeks; return s; }
function weekRef(P, g) {
  let s = 0;
  for (let pi = 0; pi < P.phases.length; pi++) { const ph = P.phases[pi]; if (g < s + ph.weeks) return { ph, pi, i: g - s }; s += ph.weeks; }
  return null;
}
function eachRow(P, fn) { P.phases.forEach(ph => ph.workouts.forEach(wo => wo.blocks.forEach(b => b.rows.forEach(r => fn(r, ph, wo, b))))); }
function recomputePhase(ph) { ph.workouts.forEach(wo => wo.blocks.forEach(b => b.rows.forEach(r => recompute(r, ph.weeks)))); }
function countEx(P) { let n = 0; eachRow(P, () => n++); return n; }

function newBlock() { return { id: uid(), rest: '', rows: [] }; }
function newWorkout(day, title) { return { id: uid(), day, title: title || 'Allenamento', blocks: [newBlock()] }; }
function newPhase(name, weeks) { return { id: uid(), name: name || 'Fase', weeks: weeks || 4, workouts: [] }; }
function newProgram({ name, teamId, weeks, days, loadMode, start }) {
  const ph = newPhase('Fase 1', weeks);
  ph.workouts = days.map((d, i) => newWorkout(d, 'Allenamento ' + LETTERS[i]));
  return { name, teamId: teamId || '', athleteId: '', start: start || '', loadMode: loadMode || 'auto', phases: [ph], createdAt: Date.now(), updatedAt: Date.now() };
}
function freshIds(wo) { wo.id = uid(); wo.blocks.forEach(b => { b.id = uid(); b.rows.forEach(r => { r.id = uid(); }); }); return wo; }

/* copia degli allenamenti partendo dai valori di una settimana: base della nuova fase */
function workoutsFromWeek(ph, i, weeks) {
  return ph.workouts.map(wo => {
    const c = freshIds(clone(wo));
    c.blocks.forEach(b => b.rows.forEach(r => { const src = r.w[i]; r.w = [{ sets: src.sets, reps: src.reps, load: src.load, rest: src.rest, rpe: src.rpe, m: {} }]; recompute(r, weeks); }));
    return c;
  });
}
/* ---- settimane ---- */
function addWeek(P) { const ph = P.phases[P.phases.length - 1]; ph.weeks++; recomputePhase(ph); }
function dupWeek(P, g) {
  const { ph, i } = weekRef(P, g);
  ph.workouts.forEach(wo => wo.blocks.forEach(b => b.rows.forEach(r => {
    const c = clone(r.w[i]); c.m = { sets: true, reps: true, load: !r.ath, rest: true, rpe: true };
    r.w.splice(i + 1, 0, c);
  })));
  ph.weeks++; recomputePhase(ph);
}
function delWeek(P, g) {
  const { ph, pi, i } = weekRef(P, g);
  if (ph.weeks === 1) { if (P.phases.length === 1) return false; P.phases.splice(pi, 1); return true; }
  ph.workouts.forEach(wo => wo.blocks.forEach(b => b.rows.forEach(r => {
    r.w.splice(i, 1);
    if (i === 0) r.w[0].m = {};
  })));
  ph.weeks--; recomputePhase(ph); return true;
}
/* ---- fasi ---- */
function splitPhase(P, g, name) {
  const { ph, pi, i } = weekRef(P, g); if (i === 0) return false;
  const np = newPhase(name || 'Fase ' + (P.phases.length + 1), ph.weeks - i);
  np.workouts = workoutsFromWeek(ph, i, np.weeks);
  ph.weeks = i; recomputePhase(ph);
  P.phases.splice(pi + 1, 0, np); return true;
}
function appendPhase(P, name, weeks, copy) {
  const last = P.phases[P.phases.length - 1];
  const np = newPhase(name, weeks);
  np.workouts = copy && last ? workoutsFromWeek(last, last.weeks - 1, weeks) : (last ? last.workouts.map(w => newWorkout(w.day, w.title)) : []);
  P.phases.push(np);
}
function mergePhaseUp(P, pi) {
  if (pi < 1) return false;
  const prev = P.phases[pi - 1], cur = P.phases[pi];
  prev.weeks += cur.weeks; recomputePhase(prev); P.phases.splice(pi, 1); return true;
}
/* ---- allenamenti nel calendario ---- */
function moveWorkout(ph, wid, day) {
  const wo = ph.workouts.find(w => w.id === wid); if (!wo || wo.day === day) return;
  const other = ph.workouts.find(w => w.day === day);
  if (other) other.day = wo.day;
  wo.day = day;
}
function copyWorkout(ph, wid, day, toPh) {
  const wo = ph.workouts.find(w => w.id === wid); toPh = toPh || ph;
  if (!wo || toPh.workouts.some(w => w.day === day)) return false;
  const c = freshIds(clone(wo)); c.day = day;
  if (toPh !== ph) c.blocks.forEach(b => b.rows.forEach(r => { r.w = [{ ...r.w[0], m: {} }]; recompute(r, toPh.weeks); }));
  toPh.workouts.push(c); return true;
}
/* ---- programma intero ---- */
function setAllAth(P, on) {
  P.loadMode = on ? 'ath' : 'auto';
  P.phases.forEach(ph => { ph.workouts.forEach(wo => wo.blocks.forEach(b => b.rows.forEach(r => { r.ath = on; }))); recomputePhase(ph); });
}
function duplicateProgram(P) {
  const C = clone(P); delete C.id;
  C.name = P.name + ' (copia)'; C.createdAt = C.updatedAt = Date.now();
  C.phases.forEach(ph => { ph.id = uid(); ph.workouts.forEach(freshIds); });
  return C;
}

/* ============ logo squadra e foto atleta ============
   L'immagine scelta viene rimpicciolita sul dispositivo (max 360 px) e salvata con i dati,
   così funziona offline e pesa poco. */
function imgField(id, src, label, kind) {
  return `<div class="fld"><label>${label}</label><div class="imgf" id="${id}">
    <div class="imgp ${kind}">${src ? `<img src="${src}" alt="">` : `<span>${kind === 'photo' ? 'Foto' : 'Logo'}</span>`}</div>
    <div class="imgb"><div class="imgbtn"><label class="btn sm">${src ? 'Cambia' : 'Carica'}<input type="file" accept="image/*" hidden></label><button type="button" class="btn sm ghost danger" data-rm ${src ? '' : 'hidden'}>Rimuovi</button></div>
    <span class="rs small">Facoltativo. Se c'è, compare sul foglio stampato.</span></div></div></div>`;
}
function wireImg(el, id, initial, kind) {
  let val = initial || '';
  const box = $('#' + id, el), prev = $('.imgp', box), inp = $('input[type=file]', box), rm = $('[data-rm]', box), lab = $('label.btn', box);
  const show = () => {
    prev.innerHTML = val ? `<img src="${val}" alt="">` : `<span>${kind === 'photo' ? 'Foto' : 'Logo'}</span>`;
    rm.hidden = !val; lab.firstChild.textContent = val ? 'Cambia' : 'Carica';
  };
  inp.onchange = async () => {
    const f = inp.files && inp.files[0]; inp.value = ''; if (!f) return;
    try { val = await shrinkImage(f, kind); show(); } catch (e) { toast('Immagine non leggibile: prova con un JPG o PNG'); }
  };
  rm.onclick = () => { val = ''; show(); };
  return { get: () => val };
}
function shrinkImage(file, kind) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      URL.revokeObjectURL(url);
      const M = 360, c = document.createElement('canvas'), x = c.getContext('2d');
      if (kind === 'photo') { // ritaglio quadrato centrato
        const s = Math.min(im.width, im.height), d = Math.min(M, s);
        c.width = c.height = d; x.drawImage(im, (im.width - s) / 2, (im.height - s) / 2, s, s, 0, 0, d, d);
        res(c.toDataURL('image/jpeg', 0.85));
      } else { // logo: proporzioni originali, sfondo trasparente
        const k = Math.min(1, M / Math.max(im.width, im.height));
        c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        x.drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL('image/png'));
      }
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
    im.src = url;
  });
}
/* ---- colori ---- */
function hexRgb(h) { h = String(h || '').replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); return Number.isFinite(n) ? [n >> 16 & 255, n >> 8 & 255, n & 255] : [229, 38, 45]; }
function mixHex(a, b, t) { const x = hexRgb(a), y = hexRgb(b); return '#' + x.map((v, i) => Math.round(v * (1 - t) + y[i] * t).toString(16).padStart(2, '0')).join(''); }
const tint = (h, a) => mixHex(h, '#ffffff', 1 - a);
const shade = (h, a = 0.35) => mixHex(h, '#000000', a);
function isLight(h) { const [r, g, b] = hexRgb(h).map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }); return 0.2126 * r + 0.7152 * g + 0.0722 * b > 0.45; }

/* ============ Firebase: accesso con Google + database sincronizzato ============
   La configurazione sta in config.js (window.FIREBASE_CONFIG). Se manca, l'app funziona
   solo sul dispositivo. Firestore tiene una copia offline: l'app parte anche senza rete. */
const Cloud = { on: false, app: null, auth: null, fs: null, user: null, installEvt: null };
function cloudInit() {
  const cfg = window.FIREBASE_CONFIG;
  if (!cfg || !cfg.apiKey || !window.FB) return false;
  try {
    Cloud.app = FB.initializeApp(cfg);
    Cloud.auth = FB.getAuth(Cloud.app);
    Cloud.fs = FB.initializeFirestore(Cloud.app, { localCache: FB.persistentLocalCache({ tabManager: FB.persistentMultipleTabManager() }) });
    const emu = window.FIREBASE_EMULATOR;
    if (emu) { FB.connectAuthEmulator(Cloud.auth, emu.auth, { disableWarnings: true }); FB.connectFirestoreEmulator(Cloud.fs, emu.host, emu.port); }
    Cloud.on = true;
  } catch (e) { console.error(e); Cloud.on = false; }
  return Cloud.on;
}
/* primo stato dell'accesso (anche offline: Firebase ricorda l'utente sul dispositivo) */
function cloudFirstUser(ms) {
  return new Promise(res => {
    let done = false; const fin = u => { if (!done) { done = true; Cloud.user = u || null; res(Cloud.user); } };
    FB.onAuthStateChanged(Cloud.auth, fin);
    setTimeout(() => fin(Cloud.auth.currentUser), ms);
  });
}
/* adattatore: stessa forma usata dallo Store (collection/doc/onSnapshot) */
function cloudDb(uid) {
  const col = c => FB.collection(Cloud.fs, 'users', uid, c), dref = (c, id) => FB.doc(Cloud.fs, 'users', uid, c, id);
  return {
    collection: c => ({
      onSnapshot: (cb, err) => FB.onSnapshot(col(c), { includeMetadataChanges: true }, s => cb({ fromCache: s.metadata.fromCache, docs: s.docs.map(d => ({ id: d.id, data: () => d.data() })) }), err),
      doc: id => ({ set: data => FB.setDoc(dref(c, id), data), delete: () => FB.deleteDoc(dref(c, id)) })
    })

}
const localOnly = () => { try { return localStorage.getItem('pb_localonly') === '1'; } catch (e) { return false; } };
const setLocalOnly = on => { try { on ? localStorage.setItem('pb_localonly', '1') : localStorage.removeItem('pb_localonly'); } catch (e) { } };
async function googleLogin(btn, msg) {
  const prov = new FB.GoogleAuthProvider(); prov.setCustomParameters({ prompt: 'select_account' });
  btn.disabled = true; msg.textContent = '';
  try { await FB.signInWithPopup(Cloud.auth, prov); setLocalOnly(false); location.reload(); }
  catch (e) {

}

/* ---------- store: offline-first (local copy + queue), syncs to the shared db when online ---------- */
const Store = {
  mode: 'init', hadDb: false, failed: false, db: null, cols: {}, subs: {}, pend: [], flushing: false, remote: {}, idb: null, listeners: [], watching: {},
  note() { this.listeners.forEach(f => f()); },
  key: 'local',
  status() {
    if (this.mode === 'mem') return ['ok', Cloud.on ? 'Solo su questo dispositivo' : 'Salvato su questo dispositivo'];
    const off = navigator.onLine === false || this.failed;
    if (off) return ['off', this.pend.length ? `Offline · ${this.pend.length} ${this.pend.length === 1 ? 'modifica' : 'modifiche'} da sincronizzare` : 'Offline · dati sul dispositivo'];
    if (this.pend.length) return ['pend', `Sincronizzo ${this.pend.length}…`];
    return ['ok', 'Sincronizzato'];
  },
  async idbOpen() {
    if (this.idb) return this.idb;
    this.idb = await new Promise((res, rej) => { const r = indexedDB.open('playbook', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); setTimeout(() => rej(new Error('idb timeout')), 1500); });
    return this.idb;
  },
  async peek(key) {
    try { const db = await this.idbOpen(); return await new Promise(res => { const q = db.transaction('kv').objectStore('kv').get(key); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); }); } catch (e) { return null; }
  },
  /* ogni account ha la sua copia sul dispositivo: 'cache:local' senza account, 'cache:<uid>' con Google */
  async open(key) {
    this.key = key || 'local';
    try {
      let v = await this.peek('cache:' + this.key);
      if (!v && this.key === 'local') v = await this.peek('cache'); // dati salvati dalle versioni precedenti
      if (v) { this.cols = v.cols || {}; this.pend = v.pend || []; this.hadDb = !!v.hadDb; return true; }
    } catch (e) { this.idb = null; try { const v = JSON.parse(localStorage.getItem('pb_cache:' + this.key) || 'null'); if (v) { this.cols = v.cols || {}; this.pend = v.pend || []; return true; } } catch (e2) { } }
    return false;
  },
  persist() {
    const v = { cols: this.cols, pend: this.pend, hadDb: this.hadDb };
    try { if (this.idb) { this.idb.transaction('kv', 'readwrite').objectStore('kv').put(v, 'cache:' + this.key); return; } } catch (e) { }
    try { localStorage.setItem('pb_cache:' + this.key, JSON.stringify(v)); } catch (e) { }
  },
  async connect() {
    if (Cloud.on && Cloud.user) { this.db = cloudDb(Cloud.user.uid); this.mode = 'db'; this.hadDb = true; this.failed = false; }
    else this.mode = 'mem';
    Object.keys(this.subs).forEach(c => this.watch(c)); this.flush(); this.note();
  },
  watch(col) {
    if (!this.db || this.watching[col]) return; this.watching[col] = true;
    this.db.collection(col).onSnapshot(s => {
      // finché il server non ha risposto, la cache di Firestore può essere vuota: teniamo la nostra copia
      if (s.fromCache && !this.remote[col] && !s.docs.length && Object.keys(this.cols[col] || {}).length) return;
      const m = {}; s.docs.forEach(d => { m[d.id] = d.data(); });
      for (const p of this.pend) if (p.col === col) { if (p.op === 'set') m[p.id] = clone(p.data); else delete m[p.id]; }
      if (!s.fromCache) { this.remote[col] = true; this.failed = false; }
      this.cols[col] = m; this.persist(); this.emit(col); this.note();
    }, e => { console.error(e); this.failed = true; this.watching[col] = false; this.note(); setTimeout(() => this.watch(col), 20000); });
  },
  sub(col, cb) {
    (this.subs[col] = this.subs[col] || []).push(cb);
    this.watch(col); setTimeout(() => this.emit(col), 0);
  },
  emit(col) { const docs = Object.entries(this.cols[col] || {}).map(([id, d]) => ({ id, ...clone(d) })); (this.subs[col] || []).forEach(cb => cb(docs)); },
  async set(col, id, data) { (this.cols[col] = this.cols[col] || {})[id] = clone(data); this.pend.push({ op: 'set', col, id, data: clone(data) }); this.persist(); this.emit(col); this.note(); this.flush(); },
  async del(col, id) { delete (this.cols[col] || {})[id]; this.pend.push({ op: 'del', col, id }); this.persist(); this.emit(col); this.note(); this.flush(); },
  async flush() {
    if (this.flushing || !this.db || this.mode === 'mem') return; this.flushing = true;
    try {
      while (this.pend.length) {
        const p = this.pend[0], d = this.db.collection(p.col).doc(p.id);
        await (p.op === 'set' ? d.set(p.data) : d.delete());
        this.pend.shift(); this.failed = false; this.persist(); this.note();
      }
    } catch (e) { console.error(e); this.failed = true; setTimeout(() => this.flush(), 15000); }
    this.flushing = false; this.note();
  }
};

/* ---------- annulla / ripristina (Ctrl+Z, Ctrl+Shift+Z) ---------- */
const U = { stack: [], redo: [], cur: null };
function undoReset() { U.stack = []; U.redo = []; U.cur = S.P ? JSON.stringify(S.P) : null; undoBtns(); }
const commitU = debounce(() => {
  if (!S.P) return; const j = JSON.stringify(S.P); if (j === U.cur) return;
  if (U.cur) { U.stack.push(U.cur); if (U.stack.length > 150) U.stack.shift(); }
  U.redo = []; U.cur = j; undoBtns();
}, 400);
/* changed(true) = azione completa (un passo di annullamento); changed() = scrittura, raggruppata */
const changed = hard => { saveP(); hard ? commitU.now() : commitU(); };
function undoBtns() { $$('[data-undo]').forEach(b => { b.disabled = !(b.dataset.undo === 'u' ? U.stack.length : U.redo.length); }); }
function undoRedo(dir) {
  if (!S.P) return; commitU.now();
  const from = dir < 0 ? U.stack : U.redo, to = dir < 0 ? U.redo : U.stack;
  if (!from.length) { toast(dir < 0 ? 'Niente da annullare' : 'Niente da ripristinare'); return; }
  to.push(U.cur); U.cur = from.pop(); S.P = JSON.parse(U.cur); saveP.now();
  $$('.pop').forEach(x => x.remove());
  const wed = $('#wed');
  if (wed) { if (weCur().wo) weRender(); else { const c = wed.closest('.ov').querySelector('[data-close]'); c && c.click(); } }
  const pg = $('#page'); if (pg && S.view === 'editor') editorView(pg);
  undoBtns(); toast(dir < 0 ? 'Annullato' : 'Ripristinato');
}
document.addEventListener('keydown', e => {
  if (S.view !== 'editor' || !(e.ctrlKey || e.metaKey) || e.altKey) return;
  const k = e.key.toLowerCase(); if (k !== 'z' && k !== 'y') return;
  const ovs = $$('.ov'); if (ovs.length && !(ovs.length === 1 && $('#wed'))) return;
  e.preventDefault(); undoRedo(k === 'y' || e.shiftKey ? 1 : -1);
});

/* ---------- a chi è assegnato ---------- */
const athById = id => S.athletes.find(a => a.id === id);
function progVisible(p) {
  if (S.team === 'all') return true;
  if (p.athleteId) { const a = athById(p.athleteId); return !!a && (a.teamIds || []).includes(S.team); }
  return p.teamId === S.team;
}
function ownerOf(p) {
  if (p.athleteId) { const a = athById(p.athleteId), t = a && teamById((a.teamIds || [])[0]); return { kind: 'ath', name: a ? a.name : 'Atleta eliminato', color: t ? t.color : '#777' }; }
  const t = teamById(p.teamId); return t ? { kind: 'team', name: t.name, color: t.color } : { kind: '', name: 'Nessuno', color: 'var(--line)' };
}
const ownerKey = p => p.athleteId ? 'a:' + p.athleteId : p.teamId ? 't:' + p.teamId : '';
function setOwner(p, v) { p.athleteId = v.startsWith('a:') ? v.slice(2) : ''; p.teamId = v.startsWith('t:') ? v.slice(2) : ''; }
function ownerOptions(sel) {
  return `<option value="">Nessuno</option><optgroup label="Squadre e clienti">${S.teams.map(t => `<option value="t:${t.id}" ${sel === 't:' + t.id ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}</optgroup>` +
    `<optgroup label="Atleti">${S.athletes.slice().sort(byName).map(a => `<option value="a:${a.id}" ${sel === 'a:' + a.id ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}</optgroup>`;
}
function progDates(p) { if (!p.start) return ''; const W = totalWeeks(p); return `${fmtDate(p.start)} → ${fmtDate(addDays(p.start, W * 7 - 1))}`; }
function progStatus(p) {
  if (!p.start) return ''; const t = todayISO(), end = addDays(p.start, totalWeeks(p) * 7 - 1);
  return t < p.start ? 'Da iniziare' : t > end ? 'Concluso' : 'In corso';
}

/* ---------- piccolo menu a comparsa ---------- */
function popMenu(anchor, items) {
  $$('.pop').forEach(x => x.remove());
  const d = document.createElement('div'); d.className = 'pop'; d.setAttribute('role', 'menu');
  d.innerHTML = items.filter(Boolean).map((it, k) => it.sep ? '<hr>' : `<button role="menuitem" data-k="${k}" class="${it.danger ? 'danger' : ''}" ${it.disabled ? 'disabled' : ''}>${it.check != null ? `<span class="ck">${it.check ? '✓' : ''}</span>` : ''}${esc(it.label)}</button>`).join('');
  document.body.appendChild(d);
  const r = anchor.getBoundingClientRect(), w = d.offsetWidth, h = d.offsetHeight;
  d.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.right - w)) + 'px';
  d.style.top = (r.bottom + h + 8 > innerHeight ? Math.max(8, r.top - h - 4) : r.bottom + 4) + 'px';
  const list = items.filter(Boolean);
  d.onclick = e => {
    const b = e.target.closest('button[data-k]'); if (!b) return;
    const it = list[+b.dataset.k];
    if (it.confirm && !b.dataset.ok) { b.dataset.ok = 1; b.textContent = it.confirm; return; }
    d.remove(); it.fn && it.fn();
  };
  setTimeout(() => { const off = e => { if (!d.contains(e.target)) { d.remove(); document.removeEventListener('mousedown', off, true); document.removeEventListener('touchstart', off, true); } }; document.addEventListener('mousedown', off, true); document.addEventListener('touchstart', off, true); }, 0);
  return d;
}

  S.pid = id; S.P = stripId(clone(p)); S.view = 'editor'; S.mw = 0; undoReset(); shell();
}
function closeEditor() { saveP.now(); S.P = null; S.pid = null; }
function editorView(el) {
  const P = S.P; if (!P) { S.view = 'programs'; return programsView(el); }
  const W = totalWeeks(P), mob = isMob(), own = ownerOf(P);
  const dens = [['compact', 'Compatta'], ['normal', 'Normale'], ['expanded', 'Espansa']];
  el.innerHTML = `<div class="edbar">
      <button class="btn sm ghost" data-x="back" aria-label="Torna ai programmi">${ic('back')}<span class="hm">Programmi</span></button>
      <input class="pname" data-x="pname" value="${esc(P.name)}" aria-label="Nome del programma">

      <div class="grow"></div>
      ${mob ? '' : `<div class="seg" role="group" aria-label="Vista">${dens.map(([k, l]) => `<button data-x="dens" data-k="${k}" aria-pressed="${S.density === k}">${l}</button>`).join('')}</div>`}
      <button class="btn sm ico" data-x="undo" data-undo="u" aria-label="Annulla" title="Annulla (Ctrl+Z)">↶</button><button class="btn sm ico" data-x="redo" data-undo="r" aria-label="Ripristina" title="Ripristina (Ctrl+Shift+Z)">↷</button>
      <button class="btn sm" data-x="addweek">＋ Settimana</button>
      <button class="btn sm" data-x="phases">Fasi</button>
      <button class="btn sm" data-x="assign">Assegna</button>
      <button class="btn sm pri" data-x="print">Stampa</button>
      <button class="btn sm ico" data-x="pmenu" aria-label="Altre azioni">${ic('more')}</button>
    </div>
    <div class="edsub"><label class="sdate">Inizio <input type="date" data-x="pstart" value="${esc(P.start || '')}" aria-label="Data di inizio"></label> · ${W} settimane · ${P.phases.length} ${P.phases.length === 1 ? 'fase' : 'fasi'} · ${P.loadMode === 'ath' ? 'kg vuoti, li scrive l\'atleta' : 'carichi in progressione automatica'}${mob ? '' : ' · trascina un allenamento per spostarlo (tieni premuto Alt per copiarlo)'}</div>
    ${mob ? calMobile(P) : calDesktop(P)}`;
  wireEditor(el); undoBtns();
}
function phaseHead(P, ph, pi) {
  const s = phaseStart(P, pi);
  return `<div class="phh"><b>${esc(ph.name)}</b><span>${ph.weeks === 1 ? 'settimana ' + (s + 1) : `settimane ${s + 1}–${s + ph.weeks}`}</span><span class="muted">· stessi esercizi, carichi che salgono settimana per settimana</span><button class="lnk" data-x="phases">Modifica fasi</button></div>`;
}
function calDesktop(P) {
  let h = '<div class="cal">', g = 0;
  P.phases.forEach((ph, pi) => {
    h += phaseHead(P, ph, pi);
    for (let i = 0; i < ph.weeks; i++, g++) {
      h += `<div class="wk"><div class="wl"><span>Sett. ${g + 1}</span><button class="ibtn sm" data-x="wkmenu" data-g="${g}" aria-label="Azioni settimana ${g + 1}">${ic('more')}</button></div>`;
      for (let d = 1; d <= 7; d++) {
        const wo = ph.workouts.find(w => w.day === d);
        h += `<div class="dc" data-g="${g}" data-d="${d}"><div class="dn">Giorno ${g * 7 + d}</div>${wo ? cardHTML(ph, wo, i, g, S.density) : `<button class="addwo" data-x="addwo" data-g="${g}" data-d="${d}" aria-label="Aggiungi allenamento al giorno ${d}">＋</button>`}</div>`;
      }
      h += '</div>';
    }
  });
  return h + '</div>';
}
function calMobile(P) {
  const W = totalWeeks(P); if (S.mw >= W) S.mw = 0;
  const { ph, pi, i } = weekRef(P, S.mw), g = S.mw;
  let h = `<div class="wkc">${Array.from({ length: W }, (_, k) => { const r = weekRef(P, k); return `<button class="fc${r.i === 0 && k ? ' ps' : ''}" data-x="mw" data-g="${k}" aria-pressed="${k === S.mw}"><b>Sett. ${k + 1}</b><small>${esc(r.ph.name)}</small></button>`; }).join('')}</div>`;
  h += `<div class="mwh"><div><b>Settimana ${g + 1}</b><span class="muted"> · ${esc(ph.name)}</span></div><button class="ibtn" data-x="wkmenu" data-g="${g}" aria-label="Azioni settimana">${ic('more')}</button></div>`;
  const wos = ph.workouts.slice().sort((a, b) => a.day - b.day);
  h += wos.map(wo => `<div class="mday"><div class="dn">Giorno ${g * 7 + wo.day}</div>${cardHTML(ph, wo, i, g, 'expanded')}<button class="btn sm logb" data-x="logwo" data-g="${g}" data-wid="${wo.id}">✓ Registra allenamento svolto</button></div>`).join('') || '<div class="empty"><b>Nessun allenamento</b>Aggiungine uno qui sotto.</div>';
  if (wos.length < 7) h += `<button class="btn wide" data-x="addwo-m" data-g="${g}">＋ Allenamento</button>`;
  return h;
}
function valStr(r, w) {
  const p = [`${w.sets || '–'}×${w.reps || '–'}`];
  if (r.ath) p.push('kg ✎'); else if (w.load) p.push(w.load + ' kg');
  if (w.rpe) p.push('RPE ' + w.rpe);
  return p.join(' · ');
}
function cardHTML(ph, wo, i, g, den) {
  const man = wo.blocks.some(b => b.rows.some(r => i > 0 && Object.values(r.w[i].m || {}).some(Boolean)));
  let body = '';
  if (den === 'compact') {
    body = `<div class="cbars">${wo.blocks.map((b, bi) => b.rows.length ? `<i style="--bc:${bColor(bi)}">${LETTERS[bi]}${b.rows.length > 1 ? '×' + b.rows.length : ''}</i>` : '').join('')}</div>`;
  } else {
    body = wo.blocks.map((b, bi) => !b.rows.length ? '' : `<div class="cb" style="--bc:${bColor(bi)}"><div class="cbh">${blockName(b, bi)}</div>${b.rows.map((r, ri) =>
      `<div class="cr"><b>${rowCode(b, bi, ri)}</b><span>${esc(r.name || 'Senza nome')}${den === 'expanded' ? `<em>${esc(valStr(r, r.w[i]))}</em>` : ''}</span></div>`).join('')}</div>`).join('');
    if (!body) body = '<div class="cempty">Nessun esercizio: tocca per scriverli</div>';
  }
  return `<div class="wcard" draggable="true" data-x="openwo" data-wid="${wo.id}" data-g="${g}" tabindex="0" role="button" aria-label="Apri ${esc(wo.title)}">
    <div class="wt">${esc(wo.title || 'Allenamento')}${(() => { const n = S.pid ? logsOf(S.pid, g, wo.id).length : 0; return n ? `<span class="done" title="Registrato nello storico">✓${n > 1 ? ' ' + n : ''}</span>` : ''; })()}${man ? '<i class="mdot" title="Contiene correzioni a mano"></i>' : ''}</div>${body}</div>`;
}
function wireEditor(el) {
  const P = S.P, rerender = () => { changed(true); editorView(el); };
  el.onclick = e => {
    const b = e.target.closest('[data-x]'); if (!b) return;
    const x = b.dataset.x, g = b.dataset.g != null ? +b.dataset.g : null;
    if (x === 'back') { closeEditor(); S.view = 'programs'; shell(); }
    else if (x === 'undo') undoRedo(-1);
    else if (x === 'redo') undoRedo(1);
    else if (x === 'assign') assignDialog();
    else if (x === 'print') { saveP.now(); S.view = 'print'; shell(); }
    else if (x === 'dens') { S.density = b.dataset.k; try { localStorage.setItem('pb_density', S.density); } catch (e2) { } editorView(el); }
    else if (x === 'addweek') { addWeek(P); rerender(); toast(`Settimana ${totalWeeks(P)} aggiunta`); if (isMob()) { S.mw = totalWeeks(P) - 1; editorView(el); } }
    else if (x === 'phases') phasesDialog();
    else if (x === 'pmenu') progMenu(b);
    else if (x === 'mw') { S.mw = g; editorView(el); }
    else if (x === 'wkmenu') weekMenu(b, g, el);
    else if (x === 'addwo') { const { ph, pi, i } = weekRef(P, g); const wo = newWorkout(+b.dataset.d, 'Allenamento'); ph.workouts.push(wo); rerender(); openWorkout(pi, wo.id, i); }
    else if (x === 'addwo-m') {
      const { ph, pi, i } = weekRef(P, g);
      popMenu(b, [1, 2, 3, 4, 5, 6, 7].filter(d => !ph.workouts.some(w => w.day === d)).map(d => ({ label: 'Giorno ' + (g * 7 + d), fn: () => { const wo = newWorkout(d, 'Allenamento'); ph.workouts.push(wo); rerender(); openWorkout(pi, wo.id, i); } })));
    }
    else if (x === 'logwo') { saveP.now(); logDialog({ P: S.P, pid: S.pid, g, wid: b.dataset.wid }); }
    else if (x === 'openwo') { const { pi, i } = weekRef(P, g); openWorkout(pi, b.dataset.wid, i); }
  };
  el.onkeydown = e => { if (e.key === 'Enter' && e.target.matches('.wcard')) e.target.click(); };
  const nm = $('[data-x="pname"]', el);
  if (nm) nm.oninput = () => { P.name = nm.value.trim() || 'Programma'; changed(); };
  const ts = $('[data-x="pteam"]', el);
  if (ts) ts.onchange = () => { setOwner(P, ts.value); rerender(); };
  const sd = $('[data-x="pstart"]', el);
  if (sd) sd.onchange = () => { P.start = sd.value; changed(true); };
  /* trascina e rilascia (PC) */
  let drag = null;
  el.ondragstart = e => { const c = e.target.closest('.wcard'); if (!c) return; drag = { wid: c.dataset.wid, g: +c.dataset.g }; e.dataTransfer.effectAllowed = 'copyMove'; try { e.dataTransfer.setData('text/plain', drag.wid); } catch (e2) { } c.classList.add('dragging'); };
  el.ondragend = () => { drag = null; $$('.dragging,.over', el).forEach(x => x.classList.remove('dragging', 'over')); };
  el.ondragover = e => { const c = e.target.closest('.dc'); if (!c || !drag) return; e.preventDefault(); e.dataTransfer.dropEffect = e.altKey ? 'copy' : 'move'; $$('.over', el).forEach(x => x !== c && x.classList.remove('over')); c.classList.add('over'); };
  el.ondrop = e => {
    const c = e.target.closest('.dc'); if (!c || !drag) return; e.preventDefault();
    const src = weekRef(P, drag.g), dst = weekRef(P, +c.dataset.g), d = +c.dataset.d;
    const busy = dst.ph.workouts.some(w => w.day === d);
    if (src.ph === dst.ph && !e.altKey) { moveWorkout(src.ph, drag.wid, d); toast(busy ? 'Allenamenti scambiati in tutta la fase' : 'Spostato in tutta la fase'); }
    else if (busy) { toast('Quel giorno ha già un allenamento'); drag = null; return; }
    else { copyWorkout(src.ph, drag.wid, d, dst.ph); toast(src.ph === dst.ph ? 'Copiato' : 'Copiato in ' + dst.ph.name); }
    drag = null; rerender();
  };
}
function weekMenu(b, g, el) {

    i > 0 && { label: 'Inizia una nuova fase da qui', fn: () => { splitPhase(P, g); done('Nuova fase creata: ora puoi cambiare gli esercizi'); } },
    { sep: true },
    { label: 'Elimina settimana', danger: true, disabled: W === 1, confirm: 'Confermi l\'eliminazione?', fn: () => { if (delWeek(P, g)) { if (S.mw >= totalWeeks(P)) S.mw = totalWeeks(P) - 1; done('Settimana eliminata'); } } }
  ]);
}
function progMenu(b) {
  const P = S.P;
  popMenu(b, [
    { label: 'Kg vuoti in tutto il programma (li scrive l\'atleta)', check: P.loadMode === 'ath', fn: () => { setAllAth(P, P.loadMode !== 'ath'); changed(true); page(); toast(P.loadMode === 'ath' ? 'Kg vuoti: li scrive l\'atleta' : 'Carichi di nuovo automatici: inserisci i kg della prima settimana'); } },

/* ---------- fasi ---------- */
function phasesDialog() {
  const P = S.P;
  const m = modal('Fasi del programma', '<div id="phl"></div>', '<div class="grow"></div><button class="btn pri" data-close>Fatto</button>', (el) => {
    const box = $('#phl', el);
    const draw = () => {
      let s = 0;

/* foglio con le settimane della fase affiancate */
function pageCols(P, ph, pi, wo) {
  const s = phaseStart(P, pi), W = ph.weeks, wr = PR.write, per = wr ? 3 : 2;
  const notes = wo.blocks.some(b => b.rows.some(r => (r.note || '').trim()));
  const span = 3 + W * per + (notes ? 1 : 0);
  const sub = `${ph.name} · ${W === 1 ? 'settimana ' + (s + 1) : `settimane ${s + 1}–${s + W}`}${P.start ? ' · dal ' + fmtDate(addDays(P.start, s * 7)) : ''}`;
  /* il foglio riempie la pagina A4 orizzontale: altezza delle righe e caratteri in base al numero di esercizi */
  const N = wo.blocks.reduce((n, b) => n + b.rows.length, 0), B = wo.blocks.filter(b => b.rows.length).length;
  const avail = 192 - 24 - 14 - 7; // mm: pagina meno margini, intestazione, testata tabella, firma
  const rh = Math.max(7.5, Math.min(15, (avail - B * 6) / Math.max(N, 1)));
  const fs = Math.max(3.1, Math.min(4.6, rh * 0.36)), wkCols = W * per;
  const fsw = wkCols > 12 ? Math.min(fs, 3.4) : fs; // tante colonne: numeri un po' più piccoli
  // larghezze: lo spazio per scrivere i kg prende la parte più grande di ogni settimana
  const weekW = (277 - 11 - 50 - 10 - (notes ? 38 : 0)) / W;
  const sxw = Math.min(22, weekW * (wr ? 0.32 : 0.42)), kgw = Math.min(28, (weekW - sxw) / (wr ? 2 : 1));
  let h = `${prSheet(P, 'land')}${prHead(P, `Giorno ${wo.day} · ${wo.title}`, sub)}<table class="sh fit" style="--rh:${rh.toFixed(2)}mm;--fs:${fs.toFixed(2)}mm;--fsw:${fsw.toFixed(2)}mm;--sxw:${sxw.toFixed(1)}mm;--kgw:${kgw.toFixed(1)}mm"><colgroup><col style="width:11mm"><col><col style="width:10mm">${Array.from({ length: W }, () => `<col style="width:${sxw.toFixed(1)}mm"><col style="width:${kgw.toFixed(1)}mm">${wr ? `<col style="width:${kgw.toFixed(1)}mm">` : ''}`).join('')}${notes ? '<col style="width:38mm">' : ''}</colgroup><thead><tr>
    <th rowspan="2" class="cod"></th><th rowspan="2" class="l">Esercizio</th><th rowspan="2">Rec</th>
    ${Array.from({ length: W }, (_, k) => `<th colspan="${per}" class="wc">Sett. ${s + k + 1}${P.start ? ' · ' + fmtDate(addDays(P.start, (s + k) * 7), true) : ''}</th>`).join('')}
    ${notes ? '<th rowspan="2" class="l">Note</th>' : ''}</tr>
    <tr>${Array.from({ length: W }, () => `<th class="wc">Serie × Rip</th><th class="kgc">Kg</th>${wr ? '<th class="kgc">Usati</th>' : ''}`).join('')}</tr></thead><tbody>`;
  wo.blocks.forEach((b, bi) => {
    if (!b.rows.length) return;
    h += blockRow(b, bi, span);
    b.rows.forEach((r, ri) => {
      h += `<tr style="${bVars(bi)}"><td class="cod">${rowCode(b, bi, ri)}</td><td class="l ex">${esc(r.name)}</td><td>${esc(r.w[0].rest || '')}</td>`;
      r.w.forEach(w => { const kg = prKg(r, w); h += `<td class="wc">${esc(sxr(w))}</td><td class="kgc ${kg ? '' : prBox(r, w)}">${esc(kg)}</td>${wr ? '<td class="kgc bx"></td>' : ''}`; });
      h += `${notes ? `<td class="l nt">${esc(r.note || '')}</td>` : ''}</tr>`;
    });
  });
  return h + `</tbody></table><footer class="sh-pw">Powered by ${esc(POWERED)}</footer></section>`;
}
/* foglio di una settimana: tutti gli allenamenti */
function pageWeek(P, g) {
  const { ph, i } = weekRef(P, g), wos = ph.workouts.slice().sort((a, b) => a.day - b.day);
  let N = 0;
  if (PR.write) { N = 3; wos.forEach(wo => wo.blocks.forEach(b => b.rows.forEach(r => { const n = intOnly(r.w[i].sets); if (n && n > N) N = n; }))); N = Math.min(N, 6); }
  let h = `${prSheet(P, 'port')}${prHead(P, `Settimana ${g + 1}`, `${ph.name}${P.start ? ' · dal ' + fmtDate(addDays(P.start, g * 7)) : ''}`)}`;
  wos.forEach(wo => {
    const notes = wo.blocks.some(b => b.rows.some(r => (r.note || '').trim()));
    const span = 6 + N + (notes ? 1 : 0);
    h += `<div class="wo"><div class="wo-t">Giorno ${wo.day} · ${esc(wo.title)}</div><table class="sh"><thead><tr><th class="cod"></th><th class="l">Esercizio</th><th>Serie</th><th>Rip</th><th class="kgc">Kg</th><th>Rec</th>
      ${N ? `<th colspan="${N}" class="wc">Kg usati</th>` : ''}${notes ? '<th class="l">Note</th>' : ''}</tr></thead><tbody>`;
    wo.blocks.forEach((b, bi) => {
      if (!b.rows.length) return;
      h += blockRow(b, bi, span);
      b.rows.forEach((r, ri) => {
        const w = r.w[i], kg = prKg(r, w), n = intOnly(w.sets) || N;
        h += `<tr style="${bVars(bi)}"><td class="cod">${rowCode(b, bi, ri)}</td><td class="l ex">${esc(r.name)}</td><td>${esc(w.sets || '')}</td><td>${esc(w.reps || '')}</td><td class="kgc ${kg ? '' : prBox(r, w)}">${esc(kg)}</td><td>${esc(w.rest || '')}</td>
          ${Array.from({ length: N }, (_, k) => `<td class="kgu ${k < n ? 'bx' : 'off'}${k === 0 ? ' wc' : ''}"></td>`).join('')}${notes ? `<td class="l nt">${esc(r.note || '')}</td>` : ''}</tr>`;
      });
    });
    h += '</tbody></table></div>';
  });
  return h + `<footer class="sh-pw">Powered by ${esc(POWERED)}</footer></section>`;
}

/* ---------- registra un allenamento svolto ---------- */
function entriesFromWorkout(wo, i) {
  const out = [];

/* ---------- andamento del carico di un esercizio (un atleta) ---------- */
function trendPoints(list, ex) {
  const q = ex.toLowerCase(), pts = [];
  list.slice().reverse().forEach(l => {
    const es = l.entries.filter(e => e.done !== false && (e.name || '').toLowerCase().includes(q));
    let best = null; es.forEach(e => { const v = numMax(e.load); if (v != null && (best == null || v > best.v)) best = { v, e }; });
    if (best) pts.push({ date: l.date, v: best.v, label: `${best.e.sets || '–'}×${best.e.reps || '–'} · ${fmtN(best.v)} kg`, plan: numMax(best.e.planLoad) });
  });
  return pts;
}
function trendHTML(list, ex) {
  const pts = trendPoints(list, ex);
  if (pts.length < 2) return pts.length ? `<div class="trend"><div class="trh"><b>${esc(ex)}</b><span class="muted small">Serve almeno un altro allenamento per vedere l'andamento.</span></div></div>` : '';
  const Wd = 720, Ht = 190, pl = 44, pr = 16, pt = 28, pb = 26;
  const vs = pts.map(p => p.v), lo = Math.min(...vs), hi = Math.max(...vs);
  const step = [1, 2, 2.5, 5, 10, 20, 25, 50].find(s => (hi - lo) / s <= 4) || 100;
  const y0 = Math.floor(lo / step) * step - (lo === hi ? step : 0), y1 = Math.ceil(hi / step) * step + (lo === hi ? step : 0);
  const X = k => pl + (pts.length === 1 ? 0 : k * (Wd - pl - pr) / (pts.length - 1)), Y = v => pt + (1 - (v - y0) / (y1 - y0 || 1)) * (Ht - pt - pb);
  let grid = ''; for (let v = y0; v <= y1 + 1e-9; v += step) grid += `<line x1="${pl}" x2="${Wd - pr}" y1="${Y(v)}" y2="${Y(v)}" class="tg"/><text x="${pl - 6}" y="${Y(v) + 4}" text-anchor="end" class="tl">${fmtN(v)}</text>`;
  const path = pts.map((p, k) => `${k ? 'L' : 'M'}${X(k).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ');
  const first = pts[0], last = pts[pts.length - 1], diff = last.v - first.v;
  const xl = [0, pts.length - 1].map(k => `<text x="${X(k)}" y="${Ht - 6}" text-anchor="${k ? 'end' : 'start'}" class="tl">${fmtDate(pts[k].date, true)}</text>`).join('');
  return `<div class="trend"><div class="trh"><b>${esc(ex)} · kg</b><span class="muted small">${pts.length} allenamenti · da ${fmtN(first.v)} a ${fmtN(last.v)} kg (${diff >= 0 ? '+' : ''}${fmtN(diff)} kg)</span></div>
    <div class="trw"><svg viewBox="0 0 ${Wd} ${Ht}" class="tsvg" role="img" aria-label="Andamento del carico di ${esc(ex)}: da ${fmtN(first.v)} a ${fmtN(last.v)} kg">${grid}${xl}
      <path d="${path}" class="tline"/>${pts.map((p, k) => `<circle cx="${X(k)}" cy="${Y(p.v)}" r="5" class="tdot"/><circle cx="${X(k)}" cy="${Y(p.v)}" r="14" class="thit" data-k="${k}"/>`).join('')}
      <text x="${X(pts.length - 1) - 8}" y="${Y(last.v) - 10}" text-anchor="end" class="tv">${fmtN(last.v)} kg</text></svg>
    <div class="ttip" hidden></div></div>
    <script type="application/json" class="tdata">${JSON.stringify(pts.map(p => ({ d: fmtDate(p.date), l: p.label, p: p.plan }))).replace(/</g, '\\u003c')}<\/script></div>`;
}
function wireTrend(el) {
  const svg = $('.tsvg', el); if (!svg) return;
  const tip = $('.ttip', el), data = JSON.parse($('.tdata', el).textContent);
  const show = c => { const d = data[+c.dataset.k], r = c.getBoundingClientRect(), w = svg.parentElement.getBoundingClientRect(); tip.innerHTML = `<b>${esc(d.d)}</b><br>${esc(d.l)}${d.p != null ? `<br><span class="muted">previsto ${fmtN(d.p)} kg</span>` : ''}`; tip.hidden = false; tip.style.left = Math.min(w.width - 150, Math.max(0, r.left - w.left - 60)) + 'px'; tip.style.top = Math.max(0, r.top - w.top - 62) + 'px'; };
  $$('.thit', svg).forEach(c => { c.onmouseenter = () => show(c); c.onclick = () => show(c); c.onmouseleave = () => { tip.hidden = true; }; });
}

function demoProgram() {
  const P = { name: DEMO_PROG.name, teamId: 't1', loadMode: 'auto', phases: [], createdAt: Date.now(), updatedAt: Date.now() };
  for (const [name, W, wos] of DEMO_PROG.phases) {
    const ph = newPhase(name, W);
    for (const [day, title, blocks] of wos) {
      const wo = { id: uid(), day, title, blocks: [] };
      blocks.forEach((lines, k) => { const b = newBlock(); lines.forEach(l => { const r = rowFromText(l, W); if (r) b.rows.push(r); }); if (k > 0 && lines.length > 1) b.rest = "1'30\""; wo.blocks.push(b); });
      ph.workouts.push(wo);
    }
    P.phases.push(ph);
  }
  return P;
}
async function seed() {
  const meta = (Store.cols.meta || {}).app;
  // primo accesso con un account vuoto: se su questo dispositivo ci sono dati usati senza account, li porto nell'account
  if (Store.mode === 'db' && !meta && !Object.keys(Store.cols.teams || {}).length && !Object.keys(Store.cols.athletes || {}).length && !Object.keys(Store.cols.programs || {}).length) {
    const loc = (await Store.peek('cache:local')) || (await Store.peek('cache'));
    const lc = loc && loc.cols;
    if (lc && ['teams', 'athletes', 'programs'].some(c => Object.keys(lc[c] || {}).length)) {
      for (const c of ['teams', 'athletes', 'programs', 'meta']) for (const [id, d] of Object.entries(lc[c] || {})) await Store.set(c, id, d);
      toast('Ho portato nel tuo account i dati di questo dispositivo');
      return;
    }
  }
  const has = c => Object.keys(Store.cols[c] || {}).length > 0;
  if (!meta && !(has('teams') || has('athletes'))) {
    for (const [id, t] of Object.entries(DEMO.teams)) await Store.set('teams', id, { name: t.name, color: t.color, createdAt: Date.now() });
    for (const [i, a] of DEMO.athletes.entries()) await Store.set('athletes', 'd' + (i + 1), { name: a[0], birth: a[1], role: a[2], injuries: a[3], contact: '', teamIds: a[4], createdAt: Date.now() });
  }
  if ((!meta || (meta.v || 1) < 2) && !has('programs')) await Store.set('programs', 'demo1', demoProgram());
  // v3: un esempio di programma assegnato a un singolo atleta
  const progs = Store.cols.programs || {};
  if ((!meta || (meta.v || 1) < 3) && progs.demo1 && (Store.cols.athletes || {}).d1 && !Object.values(progs).some(p => p.athleteId)) {
    const C = duplicateProgram({ id: 'demo1', ...clone(progs.demo1) }); C.name = progs.demo1.name; C.athleteId = 'd1'; C.teamId = ''; C.start = nextMonday(); C.sourceId = 'demo1';
    await Store.set('programs', 'demo1-d1', C);
  }
  // v4: logo di esempio per la squadra demo
  const t1 = (Store.cols.teams || {}).t1;
  if ((!meta || (meta.v || 1) < 4) && t1 && !t1.logo) await Store.set('teams', 't1', { ...t1, logo: DEMO_LOGO });
  // v5: storico di esempio per Marco Bianchi (allenamenti passati con i carichi fatti)
  if ((!meta || (meta.v || 1) < 5) && (Store.cols.athletes || {}).d1 && !Object.keys(Store.cols.logs || {}).length) {
    const kg = [80, 82.5, 85, 87.5, 85, 90];
    for (let k = 0; k < 6; k++) {
      const date = addDays(todayISO(), -7 * (6 - k) + 1), p = k === 4 ? 87.5 : kg[k];
      await Store.set('logs', 'demo-log-' + (k + 1), { athleteId: 'd1', date, title: 'Forza arto inferiore', rpe: String(7 + (k % 2)), note: k === 4 ? 'Stanco dopo la partita, carico ridotto' : '', createdAt: Date.now(),
        entries: [
          { code: 'A', name: 'Box Jump', plan: '3×4', planLoad: '', sets: '3', reps: '4', load: '', done: true, note: '' },
          { code: 'B', name: 'Trap Bar Deadlift', plan: `4×6 · ${fmtN(p)} kg`, planLoad: fmtN(p), sets: '4', reps: '6', load: fmtN(kg[k]), done: true, note: '' },
          { code: 'C1', name: 'DB RFE Split Squat', plan: '3×8 · 16 kg', planLoad: '16', sets: '3', reps: '8', load: String(16 + 2 * Math.floor(k / 2)), done: true, note: '' },
          { code: 'C2', name: 'Cable Pallof Press', plan: '3×10', planLoad: '', sets: '3', reps: '10', load: '', done: k !== 2, note: '' }] });
    }
  }
  if (!meta || (meta.v || 1) < 5) await Store.set('meta', 'app', { seeded: true, v: 5 });
}
async function boot() {
  let last = {}; try { last = JSON.parse(localStorage.getItem('pb_last') || '{}'); } catch (e) { }
  let key = 'local';
  // con Firebase configurato si entra solo con un account autorizzato (niente uso senza account)
  if (cloudInit()) {
    $('#app').innerHTML = '<div class="login"><div class="logo big"><img class="lmark" src="' + LOGO + '" alt=""><span>' + APP_NAME + '</span></div></div>';
    await cloudRedirectResult();
    const u = await cloudFirstUser(6000);
    if (!u) { loginScreen(); return; }
    if (await cloudCheckAccess(u.uid) === 'denied') { blockedScreen(u); return; }
    key = u.uid;
  }
  shell();
  const cached = await Store.open(key);
  let seeded = false;
  // il demo si crea solo quando i dati sono disponibili, mai da una cache vuota offline
  const maybeSeed = () => { if (seeded) return; if (Store.mode === 'mem' || (Store.remote.teams && Store.remote.athletes && Store.remote.meta && Store.remote.programs)) { seeded = true; seed(); } };
  Store.listeners.push(maybeSeed);
  Store.sub('meta', () => { });
  Store.sub('teams', d => { S.teams = d; S.loaded.teams = cached || !!Store.remote.teams || Store.mode === 'mem'; if (S.team !== 'all' && !teamById(S.team)) S.team = 'all'; if (S.view !== 'editor') shell(); });
  Store.sub('athletes', d => { S.athletes = d; S.loaded.athletes = cached || !!Store.remote.athletes || Store.mode === 'mem'; if (S.view === 'athletes') page(); });
  Store.sub('programs', d => { S.programs = d; if (S.view === 'programs') page(); });
  Store.sub('logs', d => { S.logs = d; if (S.view === 'history' && !$('.ov')) page(); });
  await Store.connect();
  S.loaded.teams = S.loaded.athletes = true;
  if ((last.view === 'editor' || last.view === 'print') && (Store.cols.programs || {})[last.pid]) { S.programs = Object.entries(Store.cols.programs).map(([id, d]) => ({ id, ...clone(d) })); openEditor(last.pid); }
  else { if (last.view === 'programs') S.view = 'programs'; shell(); }
  maybeSeed();
}
boot();
